name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_PROCESS_TIMEOUT: 900

jobs:
  # ──────────────────────────────────────────────
  # Backend: PHPStan + PHPUnit (MySQL 8.4 + Redis 7)
  # ──────────────────────────────────────────────
  backend:
    name: Backend (PHPStan + PHPUnit)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: portfolio
          MYSQL_USER: portfolio
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_ENV: test
      APP_SECRET: ci_test_secret
      DATABASE_URL: mysql://portfolio:secret@127.0.0.1:3306/portfolio?serverVersion=8.4&charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: redis://127.0.0.1:6379/messages
      MAILER_DSN: null://null
      N8N_BASE_URL: https://n8n.example.com
      N8N_WEBHOOK_SECRET: ci_webhook_secret
      N8N_HMAC_KEY: ci_hmac_key
      N8N_API_KEY: ci_api_key
      TURNSTILE_SECRET: ''
      CONTACT_TO_EMAIL: test@example.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, iconv, intl, json, pdo_mysql, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse

      - name: PHPUnit
        run: php bin/phpunit --fail-on-warning --fail-on-risky

  # ──────────────────────────────────────────────
  # Frontend: lint + typecheck + test + build
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Vitest
        working-directory: frontend
        run: npm run test

      - name: Vite build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          retention-days: 7

  # ──────────────────────────────────────────────
  # Docker smoke build (prod + nginx_prod targets)
  # ──────────────────────────────────────────────
  docker-smoke:
    name: Docker smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build prod image
        run: docker build -f docker/php/Dockerfile --target prod -t portfolio-prod-smoke .

      - name: Build nginx_prod image
        run: docker build -f docker/php/Dockerfile --target nginx_prod -t portfolio-nginx-smoke .

      - name: Verify images
        run: |
          docker image inspect portfolio-prod-smoke --format '{{.Id}}'
          docker image inspect portfolio-nginx-smoke --format '{{.Id}}'
