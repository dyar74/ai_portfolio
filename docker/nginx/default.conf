server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 64k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Enable ONLY when running behind your own reverse proxy / load balancer,
    # otherwise X-Forwarded-For is client-controlled (breaks IP rate limiting).
    # set_real_ip_from 172.16.0.0/12;
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Vite output: content-hashed filenames -> cache forever
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|webp|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 30s;   # > N8nClient timeout (20s)
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    # Any other .php file is not an entry point
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
