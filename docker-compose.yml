name: portfolio

x-php-env: &php-env
  APP_ENV: dev
  APP_SECRET: "${APP_SECRET}"
  DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.4&charset=utf8mb4"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
  MESSENGER_TRANSPORT_DSN: "redis://:${REDIS_PASSWORD}@redis:6379/messages"
  MAILER_DSN: "smtp://mailpit:1025"
  N8N_BASE_URL: "${N8N_BASE_URL:-https://n8n.novotek.com.ua}"
  N8N_WEBHOOK_SECRET: "${N8N_WEBHOOK_SECRET:-}"
  N8N_HMAC_KEY: "${N8N_HMAC_KEY:-}"
  N8N_API_KEY: "${N8N_API_KEY:-}"
  TURNSTILE_SECRET: "${TURNSTILE_SECRET:-}"
  CONTACT_TO_EMAIL: "${CONTACT_TO_EMAIL:-}"
  XDEBUG_MODE: "${XDEBUG_MODE:-off}"

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      # composer.lock pins Symfony 8.1.x which requires PHP >= 8.4.1
      PHP_VERSION: "8.4"
      UID: "${HOST_UID:-1000}"
      GID: "${HOST_GID:-1000}"
  volumes:
    - ./:/var/www/html
    - composer_cache:/tmp/composer-cache
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks: [app]

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  php:
    <<: *php
    environment:
      <<: *php-env
      RUN_MIGRATIONS: "1"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f php-fpm >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 180s   # first start may run composer install
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  messenger:
    <<: *php
    environment: *php-env
    command: ["php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600", "--memory-limit=128M"]
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy

  # Opt-in: docker compose --profile scheduler up -d
  # Requires a Symfony Scheduler schedule (#[AsSchedule]) in the app.
  scheduler:
    <<: *php
    environment: *php-env
    profiles: [scheduler]
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "-vv", "--memory-limit=128M"]
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      # -h 127.0.0.1 (TCP) so the init-time temporary server (socket only) doesn't count as healthy
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [app]

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    # volatile-lru: only keys with a TTL (cache, rate limiter) can be evicted;
    # Messenger streams have no TTL and are never evicted.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 128mb --maxmemory-policy volatile-lru"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [app]

  # Vite dev server with HMR. Twig shell loads assets from http://localhost:5173 in dev.
  node:
    image: node:22-alpine
    working_dir: /app/frontend
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "5173:5173"
    networks: [app]

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"   # web UI
    networks: [app]


networks:
  app: {}

volumes:
  mysql_data: {}
  redis_data: {}
  composer_cache: {}

